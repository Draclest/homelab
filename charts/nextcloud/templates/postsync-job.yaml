apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-postsync-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      containers:
        - name: occ
          image: nextcloud:33-apache
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Fix DB indices and columns
              php /var/www/html/occ db:add-missing-indices --no-interaction
              php /var/www/html/occ db:add-missing-columns --no-interaction
              php /var/www/html/occ db:add-missing-primary-keys --no-interaction
              # Convert filecache bigint
              php /var/www/html/occ db:convert-filecache-bigint --no-interaction
              # Enable and configure preview generator
              php /var/www/html/occ app:enable preview_generator || true
              php /var/www/html/occ config:app:set previewgenerator squareSizes --value="32 256"
              php /var/www/html/occ config:app:set previewgenerator widthSizes  --value="256 384"
              php /var/www/html/occ config:app:set previewgenerator heightSizes --value="256"
              # Migrate filecache extended
              php /var/www/html/occ maintenance:repair --include-expensive || true
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html
      volumes:
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: nextcloud-nextcloud
