apiVersion: v1
kind: Service
metadata:
  name: pump-price-backend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: pump-price-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: pump-price-frontend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: pump-price-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: {{ .Values.frontend.service.nodePort }}
  type: {{ .Values.frontend.service.type }}
